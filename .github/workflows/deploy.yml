name: Deploy to server

# Chạy tự động mỗi khi có commit mới trên main (thường là sau khi merge
# release/vX -> main). SSH vào server, kéo code mới nhất và build lại
# Docker Compose stack. Flyway (trong container backend) tự áp dụng
# migration + seed data khi container khởi động lại.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # cho phép bấm chạy tay từ tab Actions khi cần deploy lại thủ công

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/service-operations
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
