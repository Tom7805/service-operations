spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/service_operations}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    # In SQL ra console lam MOI request cham theo: cac luong xu ly phai xep hang ghi stdout (Windows
    # console rat cham), nen trang goi 6-8 API song song bi keo dai 300-900ms. Tat mac dinh; can go loi
    # thi bat lai bang bien moi truong: SHOW_SQL=true va SQL_LOG_LEVEL=DEBUG.
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SHOW_SQL:false}
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: true
    validate-on-migrate: false

logging:
  level:
    com.serviceops: ${APP_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}

