spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/service_operations}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: true

logging:
  level:
    com.serviceops: DEBUG
    org.hibernate.SQL: DEBUG

