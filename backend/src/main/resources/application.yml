spring:
  application:
    name: service-operations-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  # NCL-15-CN-004: tep nhap du lieu toi da 2 MB (controller chan lai lan nua va tra VALIDATION_ERROR).
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  # Thu dien tu — khai bao MOT lan o day cho MOI profile.
  #
  # `host` rong = chua cau hinh. Khi do:
  #   - profile dev/test : lien ket khoi phuc duoc ghi ra logger AUDIT_MOCK_EMAIL
  #   - profile prod     : ung dung DUNG KHOI DONG (PasswordResetMailRequiredConfig)
  # Vua dat SMTP_HOST la ban gui thu that tiep quan ngay, o BAT KY profile nao —
  # nho vay thu duoc chuc nang gui thu tren may phat trien ma khong phai dung
  # nguyen cau hinh production.
  #
  # SMTP_AUTH / SMTP_STARTTLS mac dinh bat cho may chu thu that. Voi may chu thu
  # cuc bo kieu MailHog thi tat ca hai (SMTP_AUTH=false SMTP_STARTTLS=false).
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

app:
  jwt:
    secret: ${JWT_SECRET:changeme_please_use_a_long_random_string}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  security:
    login:
      # NCL-01-CN-001-TC-02: sai mat khau 5 lan lien tiep thi tam khoa dang nhap trong
      # khoang nay (giay). Dat nho (vi du 10) qua LOGIN_LOCK_SECONDS khi can demo nhanh.
      lock-seconds: ${LOGIN_LOCK_SECONDS:300}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  password-reset:
    # 10 phut, khong phai 30. Ma 6 so chi co 1.000.000 kha nang nen cua so tan cong
    # phai hep hon nhieu so voi token dai truoc day (2^256).
    token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:10}
    # Gioi han tan suat cho /auth/forgot-password — chan theo CA IP lan email.
    # Long hon 2FA vi quen mat khau la thao tac binh thuong, nguoi dung that co
    # the bam lai vai lan khi cho thu.
    rate-limit:
      max-attempts: ${PASSWORD_RESET_RATE_LIMIT_MAX_ATTEMPTS:5}
      window-seconds: ${PASSWORD_RESET_RATE_LIMIT_WINDOW_SECONDS:900}
  frontend:
    # Goc dia chi dat vao lien ket khoi phuc gui cho nguoi dung.
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  mail:
    # Dia chi nguoi gui. BAT BUOC o profile prod — thieu thi ung dung dung khoi
    # dong (xem MailPasswordResetNotifier#validateConfig).
    from: ${MAIL_FROM:}
  two-factor:
    # NCL-01-CN-009: TOTP kiểu Google Authenticator — mã sinh trên máy người dùng,
    # không gửi/nhận qua kênh nào nên không còn config kiểu "mock-otp-logging" nữa.
    challenge-ttl-minutes: ${TWO_FACTOR_CHALLENGE_TTL_MINUTES:10}
    # Doi tu phut sang giay (khop cach LOCK_SECONDS cho khoa sai mat khau da
    # lam) — cho phep dat gia tri nho khi test (vi du 10s) ma khong can doi
    # kieu du lieu. Mac dinh production van la 900 giay = 15 phut, khong doi.
    lock-seconds: ${TWO_FACTOR_LOCK_SECONDS:900}
    issuer: ${TWO_FACTOR_ISSUER:Van Hanh Dich Vu}
    rate-limit:
      max-attempts: ${TWO_FACTOR_RATE_LIMIT_MAX_ATTEMPTS:5}
      window-seconds: ${TWO_FACTOR_RATE_LIMIT_WINDOW_SECONDS:60}
  backup:
    # NCL-15-CN-003: thu muc chua tep sao luu (JSON). Nen tro ra ngoai thu muc ma nguon khi trien khai.
    dir: ${BACKUP_DIR:./data/backups}
    # Sao luu theo lich (cron 6 truong cua Spring). "-" = tat. VD moi ngay 02h00: "0 0 2 * * *".
    schedule-cron: ${BACKUP_CRON:-}
    # QTN-30: ma xac nhan phuc hoi (buoc 1) het han sau so phut nay; sai qua so lan nay thi yeu cau bi huy.
    restore-token-ttl-minutes: ${BACKUP_RESTORE_TOKEN_TTL_MINUTES:5}
    restore-max-attempts: ${BACKUP_RESTORE_MAX_ATTEMPTS:3}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
