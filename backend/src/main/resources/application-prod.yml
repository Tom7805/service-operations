spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Cau hinh thu dien tu nam o application.yml (dung chung moi profile).
  # Rieng o profile nay, THIEU SMTP_HOST la ung dung DUNG KHOI DONG — xem
  # PasswordResetMailRequiredConfig. Va ban gia lap ghi token ra log khong bao
  # gio duoc tao o day: LoggingPasswordResetNotifier mang @Profile("!prod").
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.serviceops: INFO
    root: WARN
