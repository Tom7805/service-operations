server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nen van ban: JS/CSS/JSON giam ~70-80% dung luong truyen tai.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Asset do Vite sinh ra co hash trong ten file -> cache vinh vien, doi code thi doi ten.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html KHONG duoc cache, de lan deploy moi co hieu luc ngay.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
